# Self-test for AM-MODEL-REPOSITORY-STANDARD v1.0.1: runs the canonical
# validator against the positive and negative fixtures so regressions in the
# validator itself fail CI in this repository, not downstream repositories.
name: standard-self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Positive control — conformant fixture must pass
        run: python validators/validate_standard_declaration.py --root fixtures/positive
      - name: Negative control — version drift must fail
        run: |
          if python validators/validate_standard_declaration.py --root fixtures/negative-version-drift; then
            echo "FAIL: negative control unexpectedly passed"
            exit 1
          else
            echo "OK: negative control failed as expected"
          fi
      - name: Mapped-structure control — v1.0.1 structure mappings must pass
        run: python validators/validate_standard_declaration.py --root fixtures/mapped-structure
      - name: Negative control — mapping to a missing path must fail
        run: |
          if python validators/validate_standard_declaration.py --root fixtures/negative-bad-mapping; then
            echo "FAIL: negative control unexpectedly passed"
            exit 1
          else
            echo "OK: negative control failed as expected"
          fi
      - name: Schema sanity — declaration schema must be valid JSON
        run: python -c "import json; json.load(open('schemas/standard-declaration.schema.json')); print('OK')"
      - name: Portfolio report — script and registry must parse
        run: |
          python - <<'PY'
          import ast
          ast.parse(open('scripts/portfolio_conformance_report.py').read())
          ast.parse(open('validators/validate_standard_declaration.py').read())
          import yaml
          yaml.safe_load(open('registry/conformance.yaml'))
          print('OK: report script, validator and registry parse cleanly')
          PY
