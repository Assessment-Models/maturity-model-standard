# Repository-standard conformance (AM-MODEL-REPOSITORY-STANDARD) — REUSABLE
# workflow for every conformant maturity-model repository (CR-AM-ORG-RES-000).
#
# Usage from a model repository:
#
#   jobs:
#     repository-standard:
#       uses: Assessment-Models/maturity-model-standard/.github/workflows/repository-conformance.yml@main
#
# This gate is ADDITIVE: it runs alongside the CR-AM-11 Level 1/2/3 CI and
# replaces none of it. It validates:
#   1. the root standard.yaml declaration (id, version, conformance level)
#   2. identity coherence: standard.yaml vs model.yaml vs VERSION vs README status
#   3. repository structure required by the declared conformance level
#
# NOTE: the embedded Python validator is an inline copy of
# validators/validate_standard_declaration.py in this repository. Keep in sync.
name: Repository standard conformance (AM-MODEL-REPOSITORY-STANDARD)

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-standard-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate repository-standard declaration and structure
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          try:
              import yaml
          except ImportError:
              sys.exit("PyYAML is required")

          STANDARD_ID = "AM-MODEL-REPOSITORY-STANDARD"
          SEMVER = r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$"
          CONFORMANCE_LEVELS = {"registered": 0, "structural": 1, "full": 2}

          REQUIRED_PATHS_STRUCTURAL = [
              "README.md", "standard.yaml", "model.yaml", "VERSION", "CHANGELOG.md",
              "LICENSE", "CONTRIBUTING.md", "maturity/scale.yaml", "maturity/model",
              "examples", "scripts", ".github/workflows/local-model-ci.yml",
              ".github/workflows/contract-conformance.yml",
          ]
          REQUIRED_PATHS_FULL = [
              "docs", "docs/diagrams", "mappings", "docs/provenance.md",
              "docs/assessment-methodology.md",
          ]

          root = "."
          violations = []

          def load_yaml(path, label):
              try:
                  with open(path, encoding="utf-8") as handle:
                      return yaml.safe_load(handle) or {}
              except yaml.YAMLError as exc:
                  violations.append("%s does not parse: %s" % (label, exc))
                  return None

          if not os.path.isfile(os.path.join(root, "standard.yaml")):
              print("FAIL: standard.yaml not found - the repository does not declare "
                    "AM-MODEL-REPOSITORY-STANDARD adoption (CR-AM-ORG-RES-000).")
              sys.exit(1)

          declaration = load_yaml("standard.yaml", "standard.yaml") or {}
          repository = declaration.get("repository") or {}
          standard = declaration.get("standard") or {}
          model = declaration.get("model") or {}

          if repository.get("type") != "maturity-model":
              violations.append("standard.yaml repository.type must be 'maturity-model' (got %r). "
                                "Repositories of other classes must not declare maturity-model conformance."
                                % (repository.get("type"),))
          if standard.get("id") != STANDARD_ID:
              violations.append("standard.yaml standard.id must be %r (got %r)."
                                % (STANDARD_ID, standard.get("id")))
          if not re.match(SEMVER, str(standard.get("version") or "")):
              violations.append("standard.yaml standard.version must be a SemVer string (got %r)."
                                % (standard.get("version"),))
          conformance = standard.get("conformance")
          if conformance not in CONFORMANCE_LEVELS:
              violations.append("standard.yaml standard.conformance must be one of %s (got %r)."
                                % (sorted(CONFORMANCE_LEVELS), conformance))
          level = CONFORMANCE_LEVELS.get(conformance, 0)

          manifest = load_yaml("model.yaml", "model.yaml") if os.path.isfile("model.yaml") else None
          if manifest:
              if model.get("id") != manifest.get("id"):
                  violations.append("standard.yaml model.id (%r) does not match model.yaml id (%r)."
                                    % (model.get("id"), manifest.get("id")))
              if str(model.get("version")) != str(manifest.get("version")):
                  violations.append("standard.yaml model.version (%r) does not match model.yaml version (%r)."
                                    % (model.get("version"), manifest.get("version")))
              if repository.get("type") != manifest.get("type"):
                  violations.append("standard.yaml repository.type (%r) does not match model.yaml type (%r)."
                                    % (repository.get("type"), manifest.get("type")))

          if os.path.isfile("VERSION"):
              with open("VERSION", encoding="utf-8") as handle:
                  version_file = handle.read().strip()
              if str(model.get("version")) != version_file:
                  violations.append("standard.yaml model.version (%r) does not match VERSION file (%r)."
                                    % (model.get("version"), version_file))

          if os.path.isfile("README.md"):
              with open("README.md", encoding="utf-8") as handle:
                  text = handle.read()
              match = re.search(r"^##\s*Status\s*$\n(.*?)(?=^##\s|\Z)", text, re.S | re.M)
              if match:
                  vm = re.search(r"`(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)`", match.group(1))
                  if vm and str(model.get("version")) != vm.group(1):
                      violations.append("README Status version (%r) does not match declared model.version (%r). "
                                        "Documentation must not drift from the authoritative manifest."
                                        % (vm.group(1), model.get("version")))

          required = list(REQUIRED_PATHS_STRUCTURAL) if level >= 1 else []
          if level >= 2:
              required += REQUIRED_PATHS_FULL
          for rel in required:
              if not os.path.exists(os.path.join(root, rel)):
                  violations.append("%s conformance: required path missing: %s" % (conformance, rel))

          if violations:
              for item in violations:
                  print("FAIL: %s" % item)
              sys.exit(1)

          print("OK: repository conforms to %s v%s at conformance level '%s'."
                % (STANDARD_ID, standard.get("version"), conformance))
          PY
