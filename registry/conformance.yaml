# Portfolio conformance registry — AM-MODEL-REPOSITORY-STANDARD (CR-AM-ORG-RES-000 §5).
#
# Records repository classification and Phase 2 structure assessments across
# Assessment-Models. Under CR-AR-07, adoption snapshots for registered active
# maturity-model repositories are projected from assessment-registry records.
# assessment-registry is authoritative for each asset's adoption snapshot;
# maturity-model-standard remains normative authority for the standard itself.
# This file retains classification, Phase 2 assessment results, structure
# mappings, achieved dates and explanatory notes. Adoption fields on the seven
# registered maturity-model entries are a checked portfolio projection, not a
# competing source of truth.
#
# v1.1.0 (2026-11-14): added phase2 structure-assessment fields (Phase 2).
# v1.2.0 (2026-11-14): recorded Phase 3 adoptions — all 7 maturity-model
# repositories now declare the standard (AO structural; DTO/technology/
# operations/modernization/services-delivery structural; DT registered pending
# the structure-mappings amendment, maturity-model-standard#3). AC-20 met.
# v1.3.0 (2026-11-14): standard v1.0.1 published (structure-mappings amendment,
# maturity-model-standard#3) — schema, validator, specifications and fixtures
# updated; portfolio-report staleness policy for patch versions is now
# informational ("behind"). DT elevation PR opened; DT stays registered until
# it merges (per-repo standard_version stays "1.0.0" until each repo bumps).
# v1.4.0 (2026-11-14): first AC-24 standard-update cascade completed — DT
# elevation PR maturity-model-digital-transformation#5 merged; DT is now
# `structural` at standard v1.0.1 via recorded structure mappings. All 7
# maturity-model repositories are at `structural` (AC-20 final state). The
# other 6 stay at declared v1.0.0 (patch-behind, informational per the v1.0.1
# policy) until they bump in their own reviewed PRs.
# v1.5.0 (2026-11-14): v1.0.1 propagation complete — the six remaining
# maturity-model repositories and the template merged their patch-bump PRs
# (autonomous-operations#2, digital-transformation-operationalized#3,
# technology#3, operations#4, modernization#3, services-delivery#3,
# template#1). Every maturity-model repository now declares standard v1.0.1;
# the portfolio is fully current (AC-29 has nothing stale to report).
version: 1.6.0
updated: "2026-11-23"
# v1.6.0 (2026-11-23): CR-AR-07 — adoption fields for the seven active
# maturity-model repositories are a derived projection of the authoritative
# repository_standard snapshots in assessment-registry. Classification,
# Phase 2 assessments, structure mappings and notes remain locally governed.
standard:
  id: AM-MODEL-REPOSITORY-STANDARD
  version: "1.0.1"
classifications:
  maturity-model: full maturity-model repository standard
  assessment-model: separate assessment-model standard (out of scope for standard v1.0.0)
  shared-infrastructure: reusable engineering standards (excluded)
  registry-catalog: registry and catalogue architecture (excluded)
  legacy-frozen: frozen/superseded under CR-AM-01 Release 1 D-1 (excluded)
  org-governance: organization defaults, CI, registry, standard and template (excluded)
repositories:
  - repository: maturity-model-autonomous-operations
    classification: maturity-model
    standard_version: "1.0.1"
    conformance: structural
    notes: >-
      Reference implementation (CR-AM-ORG-RES-000 §12). Declaration, version-drift
      fix and reusable conformance workflow adopted via
      maturity-model-autonomous-operations#1 (merged 2026-11-14).
    phase2:
      assessed: "2026-11-14"
      identity: coherent
      result: adopted; full-level gaps (docs, docs/diagrams, mappings, docs/provenance,
        docs/assessment-methodology) remain backlog
  - repository: maturity-model-digital-transformation
    classification: maturity-model
    standard_version: "1.0.1"
    conformance: structural
    notes: >-
      Second, materially different implementation for AC-28 (composite model;
      CR-AM-11 §31 first-model candidate with a full Level 1/2/3 CI pedigree).
      Adopted at `registered` via maturity-model-digital-transformation#4
      (merged 2026-11-14): VERSION + README Status anchor added, CONTRIBUTING,
      declaration, conformance gate. Composite layout mapped, not restructured
      (M2); elevated to `structural` via recorded structure mappings (standard
      v1.0.1, maturity-model-standard#3) in maturity-model-digital-transformation#5
      (merged 2026-11-14). First AC-24 standard-update cascade completed.
    phase2:
      assessed: "2026-11-14"
      identity: version-anchor-missing
      result: anchor gaps closed by adoption PR #4; elevated to structural by PR #5
      gaps_closed: [standard-declaration, repository-standard-gate, version-file, readme-status, contributing]
      structure_mappings: [M2, M3]
      target_conformance: structural
      achieved: "2026-11-14" # PR #5; recorded model-definition mapping, integrity-checked
  - repository: maturity-model-digital-transformation-operationalized
    classification: maturity-model
    standard_version: "1.0.1"
    conformance: structural
    notes: >-
      Adopted at `structural` via
      maturity-model-digital-transformation-operationalized#2 (merged 2026-11-14),
      including the Phase 2 drift fix (README Status 1.0.0 -> 1.0.1).
    phase2:
      assessed: "2026-11-14"
      identity: drift
      result: >-
        drift fixed by adoption PR #2; legacy self-named duplicate directory
        retained untouched (M4), deduplication deferred to owner
      gaps_closed: [standard-declaration, repository-standard-gate, readme-status-drift]
      structure_mappings: [M1, M4, M5]
  - repository: maturity-model-technology
    classification: maturity-model
    standard_version: "1.0.1"
    conformance: structural
    notes: >-
      Adopted at `structural` via maturity-model-technology#2 (merged 2026-11-14).
    phase2:
      assessed: "2026-11-14"
      identity: coherent
      gaps_closed: [standard-declaration, repository-standard-gate]
