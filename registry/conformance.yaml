# Portfolio conformance registry — AM-MODEL-REPOSITORY-STANDARD (CR-AM-ORG-RES-000 §5).
#
# Records repository classification and repository-standard adoption across
# Assessment-Models. Reconciliation note: the registration records in
# Assessment-Models/assessment-registry remain the identity spine (id, release,
# contract handshake, immutable references); this registry records
# repository-standard adoption only, joined by repository identity. The intended
# long-term home for these fields is the assessment-registry registration schema
# (tracked as a reconciliation issue); until that lands, this file is the
# source of truth for standard adoption.
#
# v1.1.0 (2026-11-14): adds phase2 structure-assessment fields per maturity-model
# repository (CR-AM-ORG-RES-000 §8 Phase 2; see migrations/phase-2/). Additive.
version: 1.1.0
updated: "2026-11-14"
standard:
  id: AM-MODEL-REPOSITORY-STANDARD
  version: "1.0.0"
classifications:
  maturity-model: full maturity-model repository standard
  assessment-model: separate assessment-model standard (out of scope for standard v1.0.0)
  shared-infrastructure: reusable engineering standards (excluded)
  registry-catalog: registry and catalogue architecture (excluded)
  legacy-frozen: frozen/superseded under CR-AM-01 Release 1 D-1 (excluded)
  org-governance: organization defaults, CI, registry, standard and template (excluded)
repositories:
  - repository: maturity-model-autonomous-operations
    classification: maturity-model
    standard_version: "1.0.0"
    conformance: structural
    notes: >-
      Reference implementation (CR-AM-ORG-RES-000 §12). Declaration, version-drift
      fix and reusable conformance workflow adopted via
      maturity-model-autonomous-operations#1 (merged 2026-11-14).
    phase2:
      assessed: "2026-11-14"
      identity: coherent
      result: adopted; full-level gaps (docs, docs/diagrams, mappings, docs/provenance,
        docs/assessment-methodology) remain backlog
  - repository: maturity-model-digital-transformation
    classification: maturity-model
    standard_version: null
    conformance: registered
    notes: >-
      First-model candidate under CR-AM-11 §31 with a full Level 1/2/3 CI pedigree
      (existing work more mature in CI demonstration than the plan required).
      Nominated as the second, materially different implementation for AC-28
      (adoption issue maturity-model-digital-transformation#3).
    phase2:
      assessed: "2026-11-14"
      identity: version-anchor-missing
      gaps: [standard-declaration, repository-standard-gate, version-file, readme-status, contributing]
      structure_mappings: [M2, M3]
      target_conformance: registered
      phase3_pr_order: 1
      notes: >-
        Composite model (evaluation.yaml + components/ serve as the model definition,
        mapping M2); adopts at registered until the structure-mappings amendment
        (standard issue #3) allows structural with recorded mappings.
